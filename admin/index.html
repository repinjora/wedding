<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Wedding admin</title><link rel="stylesheet" href="admin.css"></head><body><main><p class="eyebrow">G&E / PRIVATE ADMIN</p><h1>Настройки приглашения</h1><p>Изменения нужно сохранить вручную в файле <code>config.js</code>, затем обновить сайт на GitHub Pages.</p><label>Hero image URL<input id="hero" placeholder="assets/hero-winter.jpg"></label><label>Map URL<input id="map" placeholder="https://..."></label><label>RSVP endpoint<input id="endpoint" placeholder="https://your-api.example/rsvp"></label><button id="copy">Скопировать config.js</button><pre id="out"></pre><a href="../">← Вернуться к приглашению</a></main><script>const fields=['hero','map','endpoint'];const out=document.querySelector('#out');function render(){const vals=Object.fromEntries(fields.map(id=>[id,document.getElementById(id).value]));out.textContent=`window.WEDDING_CONFIG = {\n  heroImage: "${vals.hero||'assets/hero-winter.jpg'}",\n  fallbackImage: "assets/couple.jpg",\n  mapUrl: "${vals.map||''}",\n  rsvpEndpoint: "${vals.endpoint||''}",\n  telegramBotToken: "",\n  telegramChatId: ""\n};`}fields.forEach(id=>document.getElementById(id).addEventListener('input',render));document.querySelector('#copy').onclick=async()=>{render();await navigator.clipboard.writeText(out.textContent);document.querySelector('#copy').textContent='Скопировано ✓'};render();</script></body></html>
